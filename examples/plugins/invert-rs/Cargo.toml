[package]
name = "dreamlab-canvas-plugin-invert"
description = "Example DreamLab Canvas WebAssembly filter plug-in: Invert"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not a member of the DreamLab Canvas workspace: it builds for wasm32-unknown-unknown only.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
