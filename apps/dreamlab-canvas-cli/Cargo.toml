[package]
name = "dreamlab-canvas-cli"
description = "Headless DreamLab Canvas: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional dreamlab-canvas-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["dreamlab-canvas-codecs/heif"]

[lints]
workspace = true

[lib]
name = "dreamlab_canvas_cli"
path = "src/lib.rs"

[[bin]]
name = "dreamlab-canvas-cli"
path = "src/main.rs"

[dependencies]
dreamlab-canvas-automation = { path = "../../crates/automation" }
dreamlab-canvas-engine = { workspace = true }
dreamlab-canvas-io = { workspace = true }
dreamlab-canvas-format = { path = "../../crates/format" }
dreamlab-canvas-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for dreamlab-canvas-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

