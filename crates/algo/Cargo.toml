[package]
name = "dreamlab-canvas-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dreamlab-canvas-geom = { workspace = true }
dreamlab-canvas-color = { workspace = true }
dreamlab-canvas-raster = { workspace = true }
serde = { workspace = true }
rustfft = "6.4.1"

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
